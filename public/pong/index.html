<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
    #c { background: #000; display: block; border: 2px solid #333; }
    .hud { color: #0f0; font-size: 18px; text-align: center; margin-bottom: 8px; }
    .hud span { margin: 0 20px; }
  </style>
</head>
<body>
  <div>
    <div class="hud"><span>Player: <b id="p1">0</b></span> <span>CPU: <b id="p2">0</b></span></div>
    <canvas id="c" width="600" height="400"></canvas>
    <p style="color:#666;text-align:center;margin-top:8px;font-size:12px">W/S or ↑/↓ to move. First to 5 wins.</p>
  </div>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    const W = 600, H = 400;
    const PAD_W = 10, PAD_H = 80, BALL_R = 8;
    let p1y = H/2 - PAD_H/2, p2y = H/2 - PAD_H/2;
    let ballX = W/2, ballY = H/2, ballDX = 4, ballDY = 2;
    let score1 = 0, score2 = 0;
    let keys = {};
    document.addEventListener('keydown', e => { keys[e.key] = true; });
    document.addEventListener('keyup', e => { keys[e.key] = false; });
    function run() {
      if (keys['w'] || keys['ArrowUp']) p1y = Math.max(0, p1y - 6);
      if (keys['s'] || keys['ArrowDown']) p1y = Math.min(H - PAD_H, p1y + 6);
      const cpuCenter = p2y + PAD_H/2;
      if (ballDX > 0 && ballX > W/2) {
        if (cpuCenter < ballY - 5) p2y = Math.min(H - PAD_H, p2y + 4);
        else if (cpuCenter > ballY + 5) p2y = Math.max(0, p2y - 4);
      }
      ballX += ballDX; ballY += ballDY;
      if (ballY <= BALL_R || ballY >= H - BALL_R) ballDY *= -1;
      if (ballX <= PAD_W + BALL_R && ballY >= p1y && ballY <= p1y + PAD_H) {
        ballDX = Math.abs(ballDX) * 1.05;
        ballDY *= 1.02;
        ballX = PAD_W + BALL_R + 2;
      }
      if (ballX >= W - PAD_W - BALL_R && ballY >= p2y && ballY <= p2y + PAD_H) {
        ballDX = -Math.abs(ballDX) * 1.05;
        ballDY *= 1.02;
        ballX = W - PAD_W - BALL_R - 2;
      }
      if (ballX < -BALL_R) { score2++; reset(); }
      if (ballX > W + BALL_R) { score1++; reset(); }
      if (score1 >= 5 || score2 >= 5) {
        score1 = 0; score2 = 0;
        ballDX = 4; ballDY = 2;
      }
      document.getElementById('p1').textContent = score1;
      document.getElementById('p2').textContent = score2;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#0f0';
      ctx.fillRect(4, p1y, PAD_W, PAD_H);
      ctx.fillRect(W - PAD_W - 4, p2y, PAD_W, PAD_H);
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_R, 0, Math.PI*2);
      ctx.fill();
      ctx.setLineDash([8, 8]);
      ctx.strokeStyle = '#333';
      ctx.beginPath();
      ctx.moveTo(W/2, 0);
      ctx.lineTo(W/2, H);
      ctx.stroke();
      requestAnimationFrame(run);
    }
    function reset() {
      ballX = W/2;
      ballY = H/2;
      ballDX = (ballDX > 0 ? -1 : 1) * 4;
      ballDY = (Math.random() - 0.5) * 4;
    }
    run();
  </script>
</body>
</html>
